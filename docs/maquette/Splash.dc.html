<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ouverture de MeuOsteo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;background:#0A1433}
a{color:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #5EEAD4;outline-offset:3px}
.ez{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s cubic-bezier(.2,.8,.2,1),background .25s ease,opacity .2s ease}
.key:hover{background:rgba(255,255,255,.16)!important;transform:translateY(-2px)}
.key:active{transform:scale(.92)!important;background:rgba(255,255,255,.26)!important;transition-duration:.06s}
.go:hover{transform:translateY(-3px)!important;box-shadow:0 22px 44px -16px rgba(34,195,214,.9),inset 0 1px 0 rgba(255,255,255,.4)!important}
.go:active{transform:scale(.97)!important}
.blob1{animation:float1 9s ease-in-out infinite alternate}
.blob2{animation:float2 11s ease-in-out infinite alternate}
.blob3{animation:float3 13s ease-in-out infinite alternate}
@keyframes float1{from{transform:translate(0,0) scale(1)}to{transform:translate(80px,40px) scale(1.15)}}
@keyframes float2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-70px,-50px) scale(.95)}}
@keyframes float3{from{transform:translate(0,0)}to{transform:translate(40px,-70px) scale(1.2)}}
.logoIn{animation:logoIn 1.1s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes logoIn{0%{opacity:0;transform:scale(.3) rotate(-25deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.ring{animation:ring 2.2s .5s ease-out both}
@keyframes ring{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
.ring2{animation:ring 2.2s .9s ease-out both}
.letter{display:inline-block;animation:letter .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes letter{from{opacity:0;transform:translateY(28px) rotateX(70deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.fadeUp{animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.bar{animation:bar 2s .6s cubic-bezier(.6,0,.2,1) both}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.shine{animation:shine 1.6s 1.2s ease-in-out both}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
.cardIn{animation:cardIn .7s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.lift{animation:lift .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes lift{from{transform:translateY(60px)}to{transform:translateY(0)}}
.dotOn{animation:dotOn .35s cubic-bezier(.3,1.8,.5,1) both}
@keyframes dotOn{from{transform:scale(.3)}to{transform:scale(1)}}
.shA{animation:shA .45s ease both}.shB{animation:shB .45s ease both}
@keyframes shA{0%,100%{transform:none}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes shB{0%,100%{transform:none}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.draw{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .15s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,234,212,.6)}100%{box-shadow:0 0 0 14px rgba(94,234,212,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; min-height: 800px; display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box; font-family: Figtree, system-ui, sans-serif; color: #FFFFFF; background: radial-gradient(1200px 700px at 50% 120%, #1F4FD8 0%, #132A6B 45%, #0A1433 100%)">
<div aria-hidden="true" class="blob1" style="position: absolute; left: -120px; top: -100px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(34,195,214,0.45) 0%, rgba(34,195,214,0) 68%)"></div>
<div aria-hidden="true" class="blob2" style="position: absolute; right: -140px; top: 80px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(59,108,246,0.55) 0%, rgba(59,108,246,0) 68%)"></div>
<div aria-hidden="true" class="blob3" style="position: absolute; left: 30%; bottom: -220px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(94,234,212,0.3) 0%, rgba(94,234,212,0) 68%)"></div>

<sc-if value="{{showStage}}" hint-placeholder-val="{{ true }}">
<div class="{{stageCls}}" style="position: relative; z-index: 1; width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center">
<div style="position: relative; width: 112px; height: 112px">
<span aria-hidden="true" class="ring" style="position: absolute; inset: 0; border-radius: 34px; border: 2px solid rgba(94,234,212,0.7)"></span>
<span aria-hidden="true" class="ring2" style="position: absolute; inset: 0; border-radius: 34px; border: 2px solid rgba(59,108,246,0.7)"></span>
<div aria-hidden="true" class="logoIn" style="position: absolute; inset: 0; border-radius: 34px; background: linear-gradient(145deg, #5EEAD4 0%, #22C3D6 35%, #3B6CF6 75%, #1F4FD8 100%); display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 900; box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -8px 20px rgba(10,20,51,0.25), 0 30px 60px -20px rgba(34,195,214,0.9)">M</div>
</div>
<h1 style="margin: 0; font-size: 46px; font-weight: 900; letter-spacing: -0.02em; perspective: 400px">
<span class="letter" style="animation-delay: .55s">M</span><span class="letter" style="animation-delay: .6s">e</span><span class="letter" style="animation-delay: .65s">u</span><span class="letter" style="animation-delay: .7s; color: #5EEAD4">O</span><span class="letter" style="animation-delay: .75s; color: #5EEAD4">s</span><span class="letter" style="animation-delay: .8s; color: #5EEAD4">t</span><span class="letter" style="animation-delay: .85s; color: #5EEAD4">e</span><span class="letter" style="animation-delay: .9s; color: #5EEAD4">o</span>
</h1>
<p class="fadeUp" style="margin: -10px 0 0; font-size: 16px; color: #C7D6FB; animation-delay: 1.1s">Le cabinet, au calme.</p>

<sc-if value="{{loading}}" hint-placeholder-val="{{ true }}">
<div role="status" aria-label="Chargement" class="fadeUp" style="width: 220px; animation-delay: 1.2s">
<div style="position: relative; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden">
<div class="bar" style="position: absolute; inset: 0; transform-origin: left; border-radius: 999px; background: linear-gradient(90deg, #5EEAD4, #22C3D6, #3B6CF6)"></div>
<div class="shine" style="position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.7), rgba(255,255,255,0))"></div>
</div>
<p style="margin: 12px 0 0; font-size: 13px; color: #9DB4E8">{{loadMsg}}</p>
</div>
</sc-if>

<sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="h-pin" class="cardIn" style="width: 100%; max-width: 340px; box-sizing: border-box; padding: 22px 22px 20px; border-radius: 28px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 40px 80px -30px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; gap: 16px">
<h2 id="h-pin" style="margin: 0; font-size: 18px; font-weight: 800">Bonjour, entrez votre code</h2>
<div class="{{dotsCls}}" role="status" aria-label="{{dotsAria}}" style="display: flex; gap: 14px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span class="{{d.cls}}" style="{{d.style}}"></span></sc-for>
</div>
<sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: -6px 0 0; font-size: 13px; font-weight: 700; color: #FFB4A8">Code incorrect, réessayez</p></sc-if>
<div style="display: grid; grid-template-columns: repeat(3, 64px); gap: 12px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" class="ez key" style="{{k.style}}">{{k.label}}</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 12px; color: #9DB4E8">Maquette : code 1234</p>
</section>
</sc-if>

<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="h-hi" class="cardIn" style="width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 16px">
<div aria-hidden="true" class="pulse" style="width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(145deg, #5EEAD4, #0EA5C6); display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 30px -12px rgba(14,165,198,0.9)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M5 12l5 5L20 7"></path></svg></div>
<h2 id="h-hi" style="margin: 0; font-size: 24px; font-weight: 800">Bonjour !</h2>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
<span class="fadeUp" style="animation-delay: .1s; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.1); font-size: 14px; font-weight: 700">3 rendez-vous aujourd'hui</span>
<span class="fadeUp" style="animation-delay: .2s; padding: 8px 14px; border-radius: 999px; background: rgba(224,146,47,0.25); color: #FFE2BD; font-size: 14px; font-weight: 700">3 à rapprocher</span>
<span class="fadeUp" style="animation-delay: .3s; padding: 8px 14px; border-radius: 999px; background: rgba(94,234,212,0.18); color: #CFFAF2; font-size: 14px; font-weight: 700">Sauvegarde OK</span>
</div>
<a href="Planning.dc.html" class="ez go fadeUp" style="animation-delay: .4s; display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; border-radius: 18px; background: linear-gradient(180deg, #22C3D6, #1F4FD8); color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none; box-shadow: 0 16px 34px -14px rgba(34,195,214,0.9), inset 0 1px 0 rgba(255,255,255,0.35)">Ouvrir mon planning<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</section>
</sc-if>
</div>
</sc-if>

<div style="position: absolute; z-index: 2; bottom: 18px; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; font-size: 13px">
<button type="button" onClick="{{replay}}" style="min-height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: rgba(255,255,255,0.08); color: #C7D6FB; font: inherit; font-weight: 700; cursor: pointer">Rejouer l'animation</button>
<a href="Planning.dc.html" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 10px; color: #C7D6FB; font-weight: 700; text-decoration: none; background: rgba(255,255,255,0.08)">Passer</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'load', code: '', err: false, shake: 0, run: 0, msg: 0 };
  }
  componentDidMount() { this.start(); }
  componentWillUnmount() { (this.ts || []).forEach(clearTimeout); }
  start() {
    (this.ts || []).forEach(clearTimeout);
    this.ts = [
      setTimeout(() => this.setState({ msg: 1 }), 1300),
      setTimeout(() => this.setState({ msg: 2 }), 2100),
      setTimeout(() => this.setState({ phase: 'lock' }), 2900)
    ];
  }
  press(k) {
    const st = this.state;
    if (st.phase !== 'lock') return;
    if (k === 'del') { this.setState({ code: st.code.slice(0, -1), err: false }); return; }
    if (k === 'ok' || st.code.length >= 4) return;
    const code = st.code + k;
    this.setState({ code, err: false });
    if (code.length === 4) {
      this.ts.push(setTimeout(() => {
        if (code === '1234') this.setState({ phase: 'open' });
        else this.setState({ code: '', err: true, shake: this.state.shake + 1 });
      }, 260));
    }
  }
  renderVals() {
    const st = this.state;
    const keyBase = 'width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.07); color: #FFFFFF; font: inherit; font-size: 24px; font-weight: 700; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)';
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'].map(k => ({
      label: k === 'del' ? '⌫' : k === 'ok' ? '' : k,
      aria: k === 'del' ? 'Effacer' : k === 'ok' ? 'Touche inactive' : 'Chiffre ' + k,
      style: k === 'ok' ? keyBase + '; visibility: hidden' : k === 'del' ? keyBase + '; font-size: 20px; background: transparent; border-color: transparent' : keyBase,
      press: () => this.press(k)
    }));
    const dots = [0, 1, 2, 3].map(i => {
      const on = i < st.code.length;
      return { cls: on ? 'dotOn' : '', style: 'width: 16px; height: 16px; border-radius: 50%; transition: background .2s ease; ' + (on ? 'background: linear-gradient(180deg, #5EEAD4, #22C3D6); box-shadow: 0 0 12px rgba(94,234,212,0.8)' : st.err ? 'background: transparent; border: 2px solid #FFB4A8' : 'background: transparent; border: 2px solid rgba(255,255,255,0.45)') };
    });
    return {
      showStage: st.phase !== 'blank',
      stageCls: st.phase === 'load' ? '' : 'lift',
      loading: st.phase === 'load', locked: st.phase === 'lock', open: st.phase === 'open',
      loadMsg: ['Ouverture de la base…', 'Synchronisation des e-mails Doctolib…', 'Prêt'][st.msg],
      keys, dots, err: st.err,
      dotsCls: st.shake ? (st.shake % 2 ? 'shA' : 'shB') : '',
      dotsAria: st.code.length + ' chiffre(s) saisi(s) sur 4',
      replay: () => {
        (this.ts || []).forEach(clearTimeout);
        this.setState({ phase: 'blank', code: '', err: false, msg: 0, run: st.run + 1 });
        this.ts = [setTimeout(() => { this.setState({ phase: 'load' }); this.start(); }, 60)];
      }
    };
  }
}
</script>
</body>
</html>
