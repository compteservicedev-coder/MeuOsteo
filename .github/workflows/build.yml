name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: the build only reads the repository; publishing a release is a separate job.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to a commit (the tag in the comment), so that a moved tag
      # cannot change what runs here. Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck, test
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build installer
        run: npm run dist -- --win --x64 --publish never

      # Pull requests only prove that the installer builds: storing ~100 MB per PR (Dependabot
      # included) filled the artifact quota. The installer to download comes from main.
      - name: Upload installer artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MeuOsteo-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MeuOsteo-Setup
          path: dist

      # A version tag (v1.2.3) publishes the installer on the Releases page: the « Télécharger »
      # link of the README. Release assets do not count against the artifact storage.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: MeuOsteo ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **Télécharger** : `MeuOsteo-Setup-….exe` ci-dessous, dans *Assets*.

            Première installation, avertissements de Windows, réglages et mise à jour : voir le [guide d'installation](https://github.com/${{ github.repository }}/blob/main/docs/INSTALLATION.md). Pour mettre à jour, fermez MeuOsteo puis lancez le nouvel installateur par-dessus l'ancien : vos données sont conservées.
          files: dist/*.exe
