name: Bug
description: Quelque chose ne fonctionne pas comme prévu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Aucune donnée réelle** : pas de nom de patient, de capture d'écran avec de vraies données, ni de fichier `.db`, `.xlsm` ou `.eml` réel. Reproduisez sur la base fictive (`npm run seed`) ou masquez tout.
        Une faille de sécurité se signale en privé (voir SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version de MeuOsteo
      description: Paramètres > Données & import
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      placeholder: Windows 11 23H2
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir la fiche d'un patient
        2. Cliquer sur « Nouvelle »
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu et résultat obtenu
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journal technique (facultatif)
      description: Extrait de `%APPDATA%\MeuOsteo\logs\main.log`. Il ne contient pas de données médicales, mais relisez-le avant de le coller.
      render: text
